# Release branch: v0.1.1
name: Build Windows

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - run: cargo build --release --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: bell-windows-x64
          path: target/x86_64-pc-windows-msvc/release/bell.exe

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'target/x86_64-pc-windows-msvc/release/bell.exe'

          gh release view $env:TAG_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG_NAME already exists. Updating bell.exe..."
            gh release upload $env:TAG_NAME $asset --clobber
          } else {
            Write-Host "Creating release $env:TAG_NAME..."
            gh release create $env:TAG_NAME $asset --title $env:TAG_NAME --generate-notes --target $env:TARGET_SHA
          }
